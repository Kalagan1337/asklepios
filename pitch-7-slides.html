<title>Asklepios — Project Demo</title>
<style>
:root{color-scheme:dark;--bg0:#060b14;--bg1:#0b1626;--bg2:#173552;--teal:#0c8783;--teal2:#5fd1c9;--mars:#d6683a;--red:#e5484d;--green:#2fbf71;--mut:#a9bccf;--dim:#7f93a8;--line:rgba(169,188,207,.16);--ease:cubic-bezier(.16,1,.3,1);--ease2:cubic-bezier(.65,0,.35,1);--back:cubic-bezier(.34,1.56,.64,1);--font:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#02050a}
body{font-family:var(--font);color:#fff;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.nocur,.nocur *{cursor:none!important}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;transform-origin:50% 50%;transform:translate(-50%,-50%);background:radial-gradient(130% 100% at 18% 0%,var(--bg2) 0%,var(--bg1) 42%,var(--bg0) 100%)}
#sky{position:absolute;left:0;top:0;width:1920px;height:1080px}
#deck{position:absolute;inset:0}
.slide{position:absolute;inset:0;padding:100px 130px 0;visibility:hidden;opacity:0}
.slide.on,.slide.out-f,.slide.out-b{visibility:visible;opacity:1}
.slide.in-f{animation:sInF .95s var(--ease) both}
.slide.in-b{animation:sInB .95s var(--ease) both}
.slide.out-f{animation:sOutF .7s var(--ease2) both}
.slide.out-b{animation:sOutB .7s var(--ease2) both}
@keyframes sInF{from{opacity:0;transform:translateX(90px) scale(.96);filter:blur(14px)}to{opacity:1;transform:none;filter:none}}
@keyframes sInB{from{opacity:0;transform:translateX(-90px) scale(1.04);filter:blur(14px)}to{opacity:1;transform:none;filter:none}}
@keyframes sOutF{from{opacity:1;transform:none;filter:none}to{opacity:0;transform:translateX(-120px) scale(1.04);filter:blur(14px)}}
@keyframes sOutB{from{opacity:1;transform:none;filter:none}to{opacity:0;transform:translateX(120px) scale(.96);filter:blur(14px)}}
#sweep{position:absolute;top:0;left:-600px;width:600px;height:100%;pointer-events:none;opacity:0;z-index:4;background:linear-gradient(90deg,transparent,rgba(95,209,201,.08) 40%,rgba(95,209,201,.2) 50%,rgba(95,209,201,.08) 60%,transparent)}
#sweep.sw-f{animation:swf .9s var(--ease2) both}
#sweep.sw-b{animation:swb .9s var(--ease2) both}
@keyframes swf{from{opacity:1;transform:translateX(0)}to{opacity:1;transform:translateX(3120px)}}
@keyframes swb{from{opacity:1;transform:translateX(3120px)}to{opacity:1;transform:translateX(0)}}
/* motion primitives: base = final state, keyframes hold the start */
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:.12em .02em .16em;margin:-.12em -.02em -.16em}
.wi{display:inline-block}
.play .wi{animation:wUp .9s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes wUp{from{transform:translateY(115%) rotate(4deg);opacity:0}to{transform:none;opacity:1}}
.play .up{animation:up .85s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.play .pop{animation:pop .75s var(--back) both;animation-delay:var(--d,0ms)}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
.play .grow{animation:grow 1.1s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.play .draw{animation:draw 1.3s var(--ease2) backwards;animation-delay:var(--d,0ms)}
.play .ic .draw{animation-duration:1.1s;animation-delay:calc(var(--d,0ms) + 250ms)}
@keyframes draw{from{stroke-dasharray:1 2;stroke-dashoffset:1}to{stroke-dasharray:1 2;stroke-dashoffset:0}}
@keyframes blink{50%{opacity:0}}
@keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.55);opacity:.45}}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important}
/* type + components */
.kick{display:flex;align-items:center;gap:16px;font-size:24px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--teal2)}
.kick b{color:var(--dim);font-weight:700;letter-spacing:.08em}
.kick i{width:48px;height:2px;background:linear-gradient(90deg,var(--teal2),transparent)}
.h2{font-size:80px;line-height:1.06;font-weight:700;letter-spacing:-.022em;margin:20px 0 0}
.lead{font-size:30px;line-height:1.4;color:var(--mut);margin:18px 0 0;max-width:1400px}
.acc{color:var(--teal2)}
.src{display:block;font-style:normal;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:14px}
.src::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal2);margin-right:10px;vertical-align:middle}
.card{background:linear-gradient(180deg,rgba(23,53,82,.6),rgba(11,22,38,.62));border:1px solid var(--line);border-radius:30px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05)}
.ico{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;background:rgba(12,135,131,.16);border:1px solid rgba(95,209,201,.3);flex:none}
.ico.big{width:96px;height:96px;border-radius:28px}.ico.big .ic{width:56px;height:56px}
.ic{width:44px;height:44px;fill:none;stroke:var(--teal2);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:34px;height:34px}
.caret{display:inline-block;width:3px;height:1.1em;background:var(--teal2);margin-left:4px;vertical-align:middle;animation:blink 1s steps(1) infinite}
.logo{position:relative;display:block;width:64px;height:64px;border-radius:18px;background:linear-gradient(150deg,#16aca4,#0c8783 55%,#086663);box-shadow:0 10px 30px rgba(12,135,131,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.logo::before,.logo::after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:3px;transform:translate(-50%,-50%)}
.logo::before{width:24%;height:62%}.logo::after{width:62%;height:24%}
.logo.big{width:200px;height:200px;border-radius:54px;box-shadow:0 30px 90px rgba(12,135,131,.5),inset 0 2px 0 rgba(255,255,255,.3)}
.logo.big::before,.logo.big::after{border-radius:10px}
.play .logo.big::before{animation:armY .7s var(--back) .55s both}
.play .logo.big::after{animation:armX .7s var(--back) .7s both}
@keyframes armY{from{transform:translate(-50%,-50%) scaleY(0)}to{transform:translate(-50%,-50%)}}
@keyframes armX{from{transform:translate(-50%,-50%) scaleX(0)}to{transform:translate(-50%,-50%)}}
/* chrome */
#brand{position:absolute;left:130px;bottom:40px;display:flex;align-items:center;gap:14px;font-size:22px;font-weight:600;color:#cfe0ee;opacity:.8;transition:opacity .6s;z-index:5}
#brand .logo{width:34px;height:34px;border-radius:10px}
.edge #brand{opacity:0}
/* footer right: slide number */
#meta{position:absolute;right:130px;bottom:40px;height:34px;display:flex;align-items:center;gap:22px;z-index:5}
#num{font-size:22px;font-weight:600;letter-spacing:.12em;color:var(--mut);font-variant-numeric:tabular-nums}
#lang{position:absolute;top:36px;right:56px;display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(6,11,20,.45);border:1px solid rgba(169,188,207,.15);opacity:.55;transition:opacity .3s;z-index:6}
#lang:hover{opacity:1}
#lang button{all:unset;cursor:pointer;font:600 18px/1 var(--font);letter-spacing:.1em;padding:10px 16px;border-radius:999px;color:var(--mut)}
#lang button.on{background:rgba(95,209,201,.18);color:#fff}
#lang button:focus-visible{outline:2px solid var(--teal2)}
#track{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(169,188,207,.08);z-index:5}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--teal2));box-shadow:0 0 16px rgba(95,209,201,.6);transition:width .8s var(--ease)}
/* 1 + 13: centred */
.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.orbit{position:absolute;left:160px;top:190px;width:1600px;height:700px;pointer-events:none}
.orbit svg{width:100%;height:100%;overflow:visible}
.orbit path{fill:none;stroke:rgba(95,209,201,.22);stroke-width:1.5}
.odot{position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f6a676,#d6683a 60%,#8f3b1c);box-shadow:0 0 24px 6px rgba(214,104,58,.5);display:none}
@supports (offset-path:path("M0 0")){.odot{display:block;offset-path:path("M100 350a700 250 0 1 0 1400 0a700 250 0 1 0 -1400 0");offset-rotate:0deg;animation:orb 18s linear infinite}}
@keyframes orb{from{offset-distance:0%}to{offset-distance:100%}}
.lw{position:relative;width:200px;height:200px;margin-bottom:44px}
.lw .ring{position:absolute;inset:0;border-radius:54px;border:2px solid rgba(95,209,201,.55);animation:ringP 3s var(--ease) infinite}
.lw .ring.r2{animation-delay:1.5s}
@keyframes ringP{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
.h1{font-size:168px;line-height:1;font-weight:700;letter-spacing:-.03em;margin:0}
.t-tag{font-size:56px;font-weight:600;margin:28px 0 0;letter-spacing:-.01em}
.sub{font-size:30px;color:var(--mut);margin:20px 0 0}
.foot{position:absolute;left:0;right:0;bottom:96px;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.team-box{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:52px}
.team{display:flex;align-items:flex-end;gap:20px;font-size:32px;color:var(--mut)}
.team-l{white-space:nowrap}
.team.set{align-items:baseline;max-width:1500px}
.team-v{font-size:40px;font-weight:700;color:#fff;text-align:left}
.team.set.wide .team-v{font-size:32px;font-weight:600;line-height:1.3}
.try{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px 14px;margin:44px 0 0;font-size:28px;color:var(--mut)}
.try b,.try a{color:var(--teal2);font-weight:700;text-decoration:none}
.try a{border-bottom:2px solid rgba(95,209,201,.45)}
.try a:hover{border-bottom-color:var(--teal2)}
.try em{font-style:normal;color:var(--dim)}
/* 2 problem */
.p-sky{position:relative;margin-top:26px;height:340px}
.p-svg{width:1660px;height:330px;overflow:visible}
.p-route{fill:none;stroke:rgba(169,188,207,.35);stroke-width:2;stroke-dasharray:2 12;stroke-linecap:round}
.p-trail{fill:none;stroke:url(#gS);stroke-width:4;stroke-linecap:round;stroke-dasharray:1 2;stroke-dashoffset:1}
.p-glow{opacity:.4;filter:blur(20px)}.p-glow.e{fill:#2aa7c9}.p-glow.m{fill:#d6683a}
.p-dot .halo{fill:rgba(95,209,201,.25)}
.play .p-dot .halo{animation:beat 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.p-lbl{fill:var(--mut);font-size:26px;font-weight:600;text-anchor:middle;letter-spacing:.08em}
.p-count{position:absolute;left:50%;top:140px;transform:translateX(-50%);text-align:center;white-space:nowrap}
.p-count b{font-size:120px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.p-count .x{font-size:40px;color:var(--mut);font-weight:600}
.p-count small{display:block;font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:-4px}
.p-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:30px}
.p-f{display:flex;gap:24px;align-items:flex-start;padding:30px 32px}
.p-f b{display:block;font-size:38px;font-weight:700;margin-bottom:6px}
.p-f span{display:block;font-size:24px;line-height:1.35;color:var(--mut)}
/* 3 iss */
.i-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;margin-top:44px}
.i-c{padding:32px;display:flex;flex-direction:column;gap:12px;min-height:410px}
.i-c h3{margin:8px 0 0;font-size:34px;font-weight:700}
.i-c p{margin:0;font-size:23px;line-height:1.42;color:var(--mut);flex:1}
.i-gap{margin-top:36px;padding:22px 40px 28px;border-radius:28px;background:linear-gradient(90deg,rgba(214,104,58,.18),rgba(214,104,58,.04));border:1px solid rgba(214,104,58,.38)}
.i-tl{width:100%;height:60px;display:block;overflow:visible}.i-tl path{stroke:rgba(169,188,207,.4);stroke-width:2;fill:none}
.i-dot{fill:var(--mars);transform-box:fill-box;transform-origin:center}
.play .i-dot{animation:pop .6s var(--back) both;animation-delay:var(--d)}
.i-gap p{margin:8px 0 0;font-size:40px;font-weight:600;line-height:1.2}
.i-gap .acc{color:#f3a37a}

/* 4 solution */
.f-row{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin-top:40px}
.f-line{position:absolute;left:0;top:50px;width:100%;height:20px;overflow:visible}
.f-line path{stroke:rgba(95,209,201,.45);stroke-width:3;fill:none;stroke-linecap:round}
.f-run{position:absolute;top:52px;left:207px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--teal2);box-shadow:0 0 18px 5px rgba(95,209,201,.7);z-index:2;opacity:0}
.play .f-run{animation:run 3.6s var(--ease2) 1.5s infinite both}
@keyframes run{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(1245px);opacity:0}}
.f-step{text-align:center;position:relative;z-index:1}
.f-n{position:relative;width:120px;height:120px;border-radius:36px;display:grid;place-items:center;margin:0 auto 20px;background:linear-gradient(150deg,#16505a,#0e2b40);border:1px solid rgba(95,209,201,.5);box-shadow:0 20px 50px -20px rgba(12,135,131,.8)}
.f-n .ic{width:56px;height:56px}
.f-n span{position:absolute;top:-12px;right:-12px;width:42px;height:42px;border-radius:50%;background:var(--teal);font-weight:700;font-size:22px;display:grid;place-items:center;box-shadow:0 0 0 4px #0b1626}
.f-step b{display:block;font-size:36px;font-weight:700}
.f-step small{display:block;font-size:22px;color:var(--mut);margin-top:6px;line-height:1.35;padding:0 24px}
.f-bottom{display:grid;grid-template-columns:1fr 500px;gap:28px;margin-top:36px}
.f-type{padding:28px 32px}
.f-in{display:flex;align-items:center;gap:16px;font-size:32px;min-height:76px;padding:14px 22px;border-radius:18px;background:rgba(6,11,20,.55);border:1px solid rgba(95,209,201,.3)}
.hl{background:linear-gradient(var(--teal2),var(--teal2)) 0 100%/0 3px no-repeat;transition:background-size .7s var(--ease)}
.hl.neg{background-image:linear-gradient(90deg,var(--dim) 50%,transparent 50%);background-size:0 3px;color:var(--mut)}
.parsed .hl{background-size:100% 3px}.parsed .hl.neg{background-size:12px 3px;background-repeat:repeat-x}
.f-tags{display:flex;gap:14px;margin-top:20px;flex-wrap:wrap;min-height:50px}
.tg{font-size:24px;font-weight:600;padding:9px 20px;border-radius:999px;opacity:0;transform:translateY(14px) scale(.9);transition:opacity .5s var(--ease),transform .6s var(--back);transition-delay:calc(var(--k)*150ms)}
.parsed .tg{opacity:1;transform:none}
.tg.ok{background:rgba(95,209,201,.15);color:#9ff0e8;border:1px solid rgba(95,209,201,.4)}
.tg.neg{background:rgba(169,188,207,.06);color:var(--mut);border:1px dashed rgba(169,188,207,.45)}
.f-side{display:flex;flex-direction:column;gap:14px;justify-content:center}
.f-b{display:flex;align-items:center;gap:18px;font-size:27px;font-weight:600;padding:16px 24px;border-radius:20px;background:rgba(95,209,201,.08);border:1px solid rgba(95,209,201,.25)}
/* 5 why */
.y-grid{display:grid;grid-template-columns:1fr 690px;gap:30px;margin-top:40px}
.y-ev{padding:34px 40px}
.y-cap,.ph-cap{font-size:21px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal2);margin-bottom:22px;font-weight:600}
.y-row{display:grid;grid-template-columns:1fr 90px;grid-template-rows:auto 18px;column-gap:20px;row-gap:12px;margin-bottom:28px}
.y-l{grid-column:1/3;font-size:27px}
.y-track{height:18px;border-radius:9px;background:rgba(169,188,207,.12);overflow:hidden;align-self:center}
.y-track i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#0c8783,#5fd1c9);transform-origin:left}
.y-w{font-size:32px;font-weight:700;color:var(--teal2);text-align:right;line-height:18px}
.y-sum{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:16px;font-size:28px;color:var(--mut)}
.y-sum b{font-size:68px;color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
.y-dx{padding:34px 40px;border-color:rgba(232,131,58,.5);background:linear-gradient(180deg,rgba(232,131,58,.16),rgba(11,22,38,.62))}
.y-k{font-size:21px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.y-name{font-size:76px;font-weight:700;line-height:1.05;margin-top:6px}
.y-sub{font-size:26px;color:var(--mut)}
.y-lv{display:inline-flex;align-items:center;gap:12px;margin-top:18px;padding:10px 22px;border-radius:999px;background:#e8833a;color:#1a0d05;font-weight:700;font-size:28px}
.y-lv i{width:12px;height:12px;border-radius:50%;background:#1a0d05;animation:beat 1.2s ease-in-out infinite}
.y-scale{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:20px}
.y-scale span{font-size:17px;line-height:1.2;padding-top:10px;border-top:6px solid;color:var(--dim)}
.y-scale span:nth-child(1){border-color:rgba(47,191,113,.5)}.y-scale span:nth-child(2){border-color:rgba(232,197,71,.5)}.y-scale span:nth-child(3){border-color:#e8833a;color:#fff;font-weight:700}.y-scale span:nth-child(4){border-color:rgba(229,72,77,.5)}
.y-steps{list-style:none;margin:20px 0 0;padding:0}
.y-steps li{display:flex;align-items:center;gap:14px;font-size:24px;padding:9px 0;border-bottom:1px dashed rgba(169,188,207,.16)}
.y-steps li i{position:relative;width:30px;height:30px;border-radius:9px;border:2px solid var(--teal2);flex:none}
.y-steps li i::after{content:"";position:absolute;left:8px;top:3px;width:8px;height:15px;border:solid var(--teal2);border-width:0 3px 3px 0;transform:rotate(45deg)}
.play .y-steps li i::after{animation:chk .45s var(--back) both;animation-delay:calc(var(--d,0ms) + 450ms)}
@keyframes chk{from{opacity:0;transform:rotate(45deg) scale(.2)}to{opacity:1;transform:rotate(45deg)}}
.y-re{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:22px;color:var(--teal2)}
/* 6 catalog */
.c-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:46px}
.c-n b{display:block;font-size:150px;line-height:1.05;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff 30%,#8fe3dc);-webkit-background-clip:text;background-clip:text;color:transparent}
.c-n.red b{background-image:linear-gradient(180deg,#ffb1b3 20%,#e5484d)}
.c-n>span{display:block;font-size:28px;color:var(--mut);margin-top:10px;max-width:470px;line-height:1.3}
.c-mq{margin:52px -130px 0;display:flex;flex-direction:column;gap:16px}
.mq{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq-in{display:flex;width:max-content;animation:mq 40s linear infinite}
.mq.r .mq-in{animation-direction:reverse;animation-duration:46s}
.mq-in span{flex:none;margin-right:16px;font-size:28px;padding:12px 26px;border-radius:999px;border:1px solid rgba(95,209,201,.3);background:rgba(95,209,201,.07);color:#d7f5f2}
.mq.r .mq-in span{border-color:rgba(214,104,58,.35);background:rgba(214,104,58,.08);color:#fbe0d2}
@keyframes mq{to{transform:translateX(-50%)}}
.c-abc{margin-top:42px}
.abc{display:flex;gap:6px}
.abc i{font-style:normal;font-size:26px;font-weight:600;width:32px;text-align:center;color:var(--dim)}
.play .abc i{animation:pop .5s var(--back) var(--d) both,lit 6s linear calc(var(--d) + 1.6s) infinite}
@keyframes lit{0%,5%{color:#fff;text-shadow:0 0 14px var(--teal2)}12%,100%{color:var(--dim);text-shadow:none}}
.c-abc>span{display:block;font-size:24px;color:var(--mut);margin-top:12px}
/* 7 card */
.m-grid{display:grid;grid-template-columns:860px 1fr;gap:30px;margin-top:40px}
.m-card,.m-db{padding:32px 38px}
.m-top{display:flex;align-items:center;gap:18px}
.m-top b{display:block;font-size:34px}.m-top small{font-size:19px;color:var(--teal2);letter-spacing:.14em;text-transform:uppercase}
.m-av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(95,209,201,.14);border:1px solid rgba(95,209,201,.35);flex:none}
.m-av.s{width:54px;height:54px}
.m-search{display:flex;align-items:center;gap:12px;margin:22px 0 6px;padding:12px 20px;border-radius:16px;background:rgba(6,11,20,.55);border:1px solid rgba(95,209,201,.3);font-size:28px;min-height:62px}
.m-f{margin:0}
.m-f>div{display:grid;grid-template-columns:190px 1fr;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}
.m-f dt{font-size:20px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.m-f dd{margin:0;font-size:30px;display:flex;align-items:center;gap:18px}
.m-sev{display:flex;gap:6px}
.m-sev i{width:30px;height:22px;border-radius:6px;background:rgba(169,188,207,.15)}
.m-sev i.on{background:linear-gradient(180deg,#f0a46f,#d6683a)}
.m-sv{color:#f3a37a}
.m-f dd.m-note{font-size:25px;color:#d7e3ee}
.m-dbh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.m-dbh b{font-size:34px}
.m-add{font-size:22px;font-weight:600;padding:10px 20px;border-radius:999px;background:var(--teal)}
.m-p{display:flex;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.m-pi{flex:1}.m-pi b{display:block;font-size:27px}.m-pi small{font-size:20px;color:var(--mut)}
.m-al{font-size:18px;font-weight:600;padding:6px 14px;border-radius:999px;background:rgba(229,72,77,.15);color:#ff9a9d;border:1px solid rgba(229,72,77,.4);white-space:nowrap}
.m-ed{opacity:.55}
.m-cap{margin-top:18px;font-size:22px;color:var(--teal2)}

/* 8 pharmacy */
.ph-grid{display:grid;grid-template-columns:1fr 640px;gap:30px;margin-top:44px}
.ph-l,.ph-r{padding:36px 40px}
.ph-drug{display:flex;gap:18px;align-items:center}.ph-drug b{display:block;font-size:34px}.ph-drug small{font-size:22px;color:var(--mut)}
.ph-bars{margin-top:32px;display:flex;flex-direction:column;gap:22px}
.ph-row{display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:22px;row-gap:10px;font-size:25px;color:var(--mut)}
.ph-row b{font-size:30px;color:#fff;text-align:right;white-space:nowrap}
.ph-row .ph-tr{grid-column:1/3}
.ph-tr{height:28px;border-radius:10px;background:rgba(169,188,207,.1);overflow:hidden}
.ph-tr i{display:block;height:100%;border-radius:10px;transform-origin:left}
.ph-tr.need i{width:100%;background:repeating-linear-gradient(135deg,rgba(169,188,207,.42) 0 10px,rgba(169,188,207,.22) 10px 20px)}
.ph-tr.left i{width:25%;background:linear-gradient(90deg,#d6683a,#f0a46f)}
.ph-warn,.ph-sub{display:flex;align-items:center;gap:16px;margin-top:30px;padding:18px 22px;border-radius:18px;font-size:26px}
.ph-warn{background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.45);color:#ffb3b5}
.ph-warn .ic{stroke:#ff9a9d}
.ph-sub{margin-top:16px;background:rgba(95,209,201,.08);border:1px solid rgba(95,209,201,.3);color:#c9f1ee}
.ph-g{width:520px;height:290px;display:block;margin:4px auto 0;overflow:visible}
.ph-bg,.ph-val{fill:none;stroke-width:30;stroke-linecap:round}
.ph-bg{stroke:rgba(169,188,207,.14)}
.ph-val{stroke:url(#gG);stroke-dasharray:1 2;stroke-dashoffset:0}
.ph-tick{stroke:#fff;stroke-width:4;stroke-linecap:round}
.ph-ndl path{stroke:#fff;stroke-width:6;stroke-linecap:round}.ph-ndl circle{fill:#fff}
.ph-v{text-align:center;margin-top:6px}.ph-v b{font-size:96px;font-weight:700;font-variant-numeric:tabular-nums}.ph-v span{font-size:44px;color:var(--mut)}
.ph-note{text-align:center;font-size:21px;color:var(--mut);line-height:1.5}
.ph-model{display:inline-block;margin-right:10px;padding:2px 12px;border-radius:999px;border:1px solid rgba(243,178,122,.55);background:rgba(243,178,122,.1);color:#f3b27a;font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;vertical-align:2px}
.ph-c{margin-top:18px;text-align:center;font-size:24px;font-weight:600;color:#f3b27a}
/* 9 drill */
.d-grid{display:grid;grid-template-columns:560px 400px 1fr;gap:34px;margin-top:40px;align-items:center}
.d-alarm{padding:32px 34px;border-color:rgba(229,72,77,.6);transition:border-color .6s}
.run .d-alarm{animation:alarm 1.2s ease-in-out infinite}
@keyframes alarm{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}50%{box-shadow:0 0 0 10px rgba(229,72,77,.18),0 0 70px rgba(229,72,77,.4)}}
.done .d-alarm{border-color:rgba(47,191,113,.6)}
.d-al{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#ff8f92;transition:color .6s}
.d-al i{width:16px;height:16px;border-radius:50%;background:var(--red)}
.run .d-al i{animation:blink .8s steps(1) infinite}
.done .d-al{color:#7be3a8}.done .d-al i{background:var(--green)}
.d-sc{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.d-sc span{font-size:20px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.d-sc span.on{border-color:rgba(229,72,77,.6);color:#fff;background:rgba(229,72,77,.15)}
.d-vit{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}
.d-vit div{padding:16px 20px;border-radius:20px;background:rgba(6,11,20,.5);white-space:nowrap}
.d-vit small{display:block;font-size:20px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.d-vit b{font-size:68px;font-weight:700;font-variant-numeric:tabular-nums;color:#ff8f92;transition:color .6s}
.done .d-vit b{color:#7be3a8}
.d-vit em{font-style:normal;font-size:24px;color:var(--mut);margin-left:6px}
.d-st{margin-top:18px;font-size:24px;font-weight:600;position:relative;height:34px}
.d-st span{position:absolute;left:0;top:0;transition:opacity .5s}
.d-bad{color:#ff8f92}.d-ok{color:#7be3a8;opacity:0}
.done .d-bad{opacity:0}.done .d-ok{opacity:1}
.d-mid{position:relative;width:400px;height:400px}
.d-ring{width:400px;height:400px;overflow:visible}
.d-rbg,.d-rv{fill:none;stroke-width:22}
.d-rbg{stroke:rgba(169,188,207,.12)}
.d-rv{stroke:var(--red);stroke-linecap:round;stroke-dasharray:1 2;stroke-dashoffset:0;transition:stroke .6s;filter:drop-shadow(0 0 12px rgba(229,72,77,.5))}
.done .d-rv{stroke:var(--green);filter:drop-shadow(0 0 12px rgba(47,191,113,.5))}
.d-time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.d-time b{font-size:110px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.d-time small{font-size:22px;color:var(--mut);text-transform:uppercase;letter-spacing:.14em}
.d-grade{padding:34px 36px;opacity:0;transform:translateY(30px) scale(.96);transition:opacity .6s var(--ease),transform .8s var(--back);border-color:rgba(47,191,113,.55);background:linear-gradient(180deg,rgba(47,191,113,.16),rgba(11,22,38,.62))}
.done .d-grade{opacity:1;transform:none}
.d-gk{font-size:20px;text-transform:uppercase;letter-spacing:.14em;color:var(--mut)}
.d-g{display:block;font-size:62px;font-weight:700;color:#7be3a8;line-height:1.1;margin-top:6px}
.d-g span{color:#fff}
.d-grade ul{list-style:none;padding:0;margin:18px 0 0}
.d-grade li{display:flex;align-items:center;gap:12px;font-size:23px;padding:8px 0;opacity:0;transform:translateX(20px);transition:opacity .5s,transform .6s var(--ease);transition-delay:calc(300ms + var(--k)*150ms)}
.done .d-grade li{opacity:1;transform:none}
.d-grade li i{width:12px;height:12px;border-radius:50%;background:var(--green)}
.d-scale{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.d-scale span{font-size:17px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.d-scale .on{border-color:rgba(47,191,113,.6);color:#7be3a8}
/* 10 guardian */
.g-grid{display:grid;grid-template-columns:620px 1fr;gap:30px;margin-top:38px}
.g-left{display:flex;flex-direction:column;gap:20px}
.g-crew{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g-m{display:flex;align-items:center;gap:14px;padding:22px;position:relative;transition:border-color .5s,background .5s}
.g-m b{display:block;font-size:24px}.g-m small{font-size:22px;color:var(--mut)}
.g-s{font-variant-numeric:tabular-nums;color:#fff;font-weight:700}
.g-st{position:absolute;top:18px;right:18px;width:14px;height:14px;border-radius:50%;background:var(--green);transition:background .4s}
.g-m.down{border-color:rgba(229,72,77,.6);background:rgba(229,72,77,.1)}
.g-m.down .g-st{background:var(--red);animation:blink .8s steps(1) infinite}
.g-m.ok{border-color:rgba(47,191,113,.55)}
.g-ship{padding:18px 26px}
.g-ship svg{width:100%;height:200px;overflow:visible;display:block}
.g-mod{fill:rgba(95,209,201,.06);stroke:rgba(95,209,201,.45);stroke-width:2;transition:fill .5s,stroke .5s}
.leak .g-mod.a{fill:rgba(229,72,77,.14);stroke:var(--red)}
.g-ship text{fill:var(--mut);font-size:19px;text-anchor:middle;font-family:var(--font)}
.g-hatch{stroke:#fff;stroke-width:8;stroke-linecap:round;fill:none;stroke-dasharray:1 2;stroke-dashoffset:1;transition:stroke-dashoffset .7s var(--ease)}
.hatch .g-hatch{stroke-dashoffset:0}
.g-leak circle{fill:#ff8f92;opacity:0}
.leak .g-leak circle{animation:leak 1.6s linear infinite}
.leak .g-leak circle:nth-child(2){animation-delay:.53s}.leak .g-leak circle:nth-child(3){animation-delay:1.06s}
@keyframes leak{0%{opacity:.9;transform:translateX(0)}100%{opacity:0;transform:translateX(-70px)}}
.g-o2 circle{fill:var(--teal2);opacity:0}
.o2 .g-o2 circle{animation:o2 2.4s ease-in-out infinite}
.o2 .g-o2 circle:nth-child(2){animation-delay:.4s}.o2 .g-o2 circle:nth-child(3){animation-delay:.8s}.o2 .g-o2 circle:nth-child(4){animation-delay:1.2s}.o2 .g-o2 circle:nth-child(5){animation-delay:1.6s}
@keyframes o2{0%{opacity:0;transform:translateY(16px)}30%,70%{opacity:.9}100%{opacity:0;transform:translateY(-16px)}}
html.rm .o2 .g-o2 circle{opacity:.8}
.g-log{padding:30px 36px}
.g-h{display:flex;align-items:center;gap:14px}.g-h b{font-size:30px}
.g-mode{margin-left:auto;font-size:18px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--mut);transition:background .5s,color .5s,border-color .5s}
.auto .g-mode{background:var(--teal);border-color:var(--teal);color:#fff}
.g-log ol{list-style:none;margin:18px 0 0;padding:0}
.g-log li{display:flex;align-items:center;gap:16px;font-size:26px;padding:12px 0;border-bottom:1px solid var(--line);opacity:0;transform:translateX(30px);transition:opacity .5s var(--ease),transform .7s var(--ease)}
.g-log li.on{opacity:1;transform:none}
.g-log li::before{content:"";width:12px;height:12px;border-radius:50%;flex:none;background:currentColor}
.g-log li.r{color:#ff9a9d}.g-log li.o{color:#f3b27a}.g-log li.t{color:#9ff0e8}.g-log li.g{color:#7be3a8}
/* 11 science */
.sc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:40px}
.sc-t{padding:30px 34px 28px;position:relative;overflow:hidden;min-height:296px;display:flex;flex-direction:column}
.sc-ln{position:absolute;left:0;top:0;width:100%;height:4px}
.sc-ln path{stroke:var(--teal2);stroke-width:8;fill:none}
.sc-v{font-size:84px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.sc-v small{font-size:36px;color:var(--teal2);font-weight:600;letter-spacing:0}
.sc-t p{font-size:23px;line-height:1.4;color:var(--mut);margin:16px 0 0;flex:1}
/* 12 next */
.n-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:44px}
.n-c{padding:36px;display:flex;flex-direction:column;min-height:470px}
.n-c h3{font-size:36px;margin:26px 0 10px}
.n-c p{font-size:24px;line-height:1.42;color:var(--mut);margin:0;flex:1}
.n-viz{height:80px;margin-top:20px;display:flex;align-items:center}
.n-viz svg{width:100%;height:80px;overflow:visible}
.n-ecg{fill:none;stroke:var(--teal2);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1 2}
.play .n-ecg{animation:ecg 2.4s linear infinite}
@keyframes ecg{0%{stroke-dashoffset:1}60%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
.n-wave{fill:none;stroke:#f3a37a;stroke-width:3;stroke-linecap:round;stroke-dasharray:8 10}
.play .n-wave{animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}
.n-bub{display:flex;gap:10px;align-items:center;padding:18px 24px;border-radius:24px 24px 24px 6px;background:rgba(95,209,201,.12);border:1px solid rgba(95,209,201,.3)}
.n-bub span{width:14px;height:14px;border-radius:50%;background:var(--teal2);opacity:.3}
.play .n-bub span{animation:dots 1.4s ease-in-out infinite}
.play .n-bub span:nth-child(2){animation-delay:.2s}.play .n-bub span:nth-child(3){animation-delay:.4s}
@keyframes dots{0%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-8px)}}
.n-foot{display:flex;align-items:center;gap:18px;margin-top:40px;font-size:40px;font-weight:600}

/* first-slide navigation hint: fades in after the title animation */
.play .fade{animation:fade 1.1s ease both;animation-delay:var(--d,0ms)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hint{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);white-space:nowrap;text-align:center;font-size:20px;letter-spacing:.04em;color:#93a7bb;pointer-events:none}
/* lead: one line where it fits, balanced lines otherwise */
.lead{max-width:1660px;text-wrap:balance}
/* last slide: team / members as an aligned two-column block */
.team-box{display:grid;grid-template-columns:auto auto;justify-content:center;align-items:end;column-gap:20px;row-gap:14px}
.team-box .team{display:contents}
.team-box .team-l{text-align:right}
.team-box .team.set>*{align-self:baseline}
.team-box .team-v{text-align:left;max-width:1100px}
.hint kbd{display:inline-block;min-width:34px;margin-right:4px;padding:3px 9px;border-radius:8px;border:1px solid rgba(169,188,207,.38);border-bottom-width:3px;background:rgba(6,11,20,.5);font:700 18px/1.2 var(--font);color:#dbe7f1;text-align:center}
.hint>span{white-space:nowrap}
/* ISS slide: the gap line wraps into even lines and the band keeps clear of the footer */
.i-c{min-height:380px}
.i-gap{margin-top:30px}
.i-gap p{text-wrap:pretty}
html[lang="en"] .i-gap p{font-size:36px}
.m-cap{text-wrap:balance}
/* catalog counters never wrap */
.c-n b{white-space:nowrap}
/* ---------- submission deck ---------- */
/* 1 title: name, challenge, team */
.t7 .lw{width:150px;height:150px;margin-bottom:30px}
.t7 .lw .ring{border-radius:42px}
.t7 .logo.big{width:150px;height:150px;border-radius:42px}
.t7 .h1{font-size:150px}
.t7 .t-tag{font-size:52px;margin-top:22px}
.t7 .sub{font-size:28px;margin-top:14px}
.t7-meta{position:relative;display:grid;grid-template-columns:auto minmax(0,auto);justify-content:center;align-items:baseline;column-gap:26px;row-gap:12px;margin-top:40px;padding:22px 44px 26px;border-radius:26px;background:linear-gradient(180deg,rgba(12,26,42,.94),rgba(7,14,25,.94));border:1px solid var(--line);box-shadow:0 30px 80px -30px rgba(0,0,0,.7);text-align:left;max-width:1500px}
.t7-ev{grid-column:1/3;text-align:center;font-size:18px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--teal2);margin-bottom:4px}
.t7-row,.t7-meta .team{display:contents}
.t7-k,.t7-meta .team-l{font-size:18px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-align:right;white-space:nowrap}
.t7-row b{font-size:30px;font-weight:700;color:#fff}
.t7-meta .team-v,.t7-meta .team.set.wide .team-v{font-size:30px;font-weight:700;line-height:1.3}
/* 5 safety net: training alarm + crew guardian */
.sf-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px;align-items:stretch}
.sf-d{padding:30px 34px}
.sf-p{margin:12px 0 0;font-size:24px;color:var(--mut)}
.sf-d .d-sc{margin-top:16px}
.sf-dm{display:flex;align-items:center;gap:34px;margin-top:22px}
.sf-ring{position:relative;width:236px;height:236px;flex:none}
.sf-ring .d-ring{width:236px;height:236px}
.sf-ring .d-rbg,.sf-ring .d-rv{stroke-width:26}
.sf-ring .d-time b{font-size:68px}
.sf-ring .d-time small{font-size:17px}
.sf-vit{flex:1;grid-template-columns:1fr;gap:14px;margin-top:0}
.sf-vit div{padding:12px 20px}
.sf-vit b{font-size:56px}
.sf-st{margin-top:22px;font-size:25px}
.sf-g{padding:30px 34px}
.sf-crew{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.sf-crew .g-m{flex-direction:column;align-items:flex-start;justify-content:space-between;gap:6px;padding:16px 16px 14px;border-radius:20px}
.sf-crew .g-m b{font-size:19px;line-height:1.2;padding-right:14px}
.sf-crew .g-m small{font-size:20px}
.sf-crew .g-st{top:14px;right:12px;width:12px;height:12px}
.sf-g ol{margin-top:14px}
.sf-g li{font-size:24px;padding:10px 0}
/* 6 science & data */
.dt-lbl{display:flex;align-items:center;gap:18px;margin-top:34px;font-size:19px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--teal2)}
.dt-lbl i{flex:1;height:1px;background:linear-gradient(90deg,rgba(95,209,201,.45),transparent)}
.dt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:16px}
.dt-t{position:relative;overflow:hidden;padding:26px 28px 24px;display:flex;flex-direction:column}
.dt-v{font-size:66px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.dt-v small{font-size:28px;color:var(--teal2);font-weight:600;letter-spacing:0}
.dt-t p{margin:14px 0 0;font-size:22px;line-height:1.35;color:var(--mut);flex:1;text-wrap:pretty}
.dt-use span{text-wrap:balance}
.dt-t .src{margin-top:12px;font-size:16px}
.dt-use{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:21px;line-height:1.3;color:#c9f1ee}
.dt-use .ic{width:30px;height:30px}
.dt-p{display:grid;grid-template-columns:auto 1fr 470px;align-items:center;gap:28px;margin-top:16px;padding:24px 32px}
.dt-pi b{display:block;font-size:30px}
.dt-pi p{margin:6px 0 0;font-size:22px;line-height:1.35;color:var(--mut)}
.dt-pi .src{margin-top:8px;font-size:16px}
.dt-p .dt-use{margin:0;padding:0 0 0 28px;border-top:0;border-left:1px solid var(--line);align-self:stretch}
.dt-note{margin:20px 0 0;font-size:20px;color:var(--dim)}
/* 7 what's next + try it */

/* ---------- shared components added in round 2 (all decks) ---------- */

<body>
<div id="stage">

</div>
<script>
const LOCAL_BUILD = true;
/* Team, shown on the first and last slides of the full deck and on the title of the submission and defense decks.
   Members are written in the slide's language. Backtick strings, so a name with an apostrophe is safe. */
const TEAM_INFO = { name: `vod0laz1`, members: { uk: `Максим, Матвій, Дмитро, Станіслав, Денис`, en: `Maksym, Matvii, Dmytro, Stanislav, Denys` } };
/* Public link to the app: replace the placeholder by plain search-and-replace. Until then the slides say index.html. */
const LINK_INFO = { project: `{{PROJECT_LINK}}` };

/* Slides 1-7: text in both languages + HTML builder + optional JS timeline.
   mood = background glow [x, y, radius, alpha, color key]. *word* = accent, \n = line break. */
function mq(a) { const s = a.map(p => `<span>${esc(p)}</span>`).join(''); return s + s; }

/* Earth → Mars with the one-way signal delay; play() of the problem slide animates it (.p-dot, .p-trail, .p-n) */
function pSky(t, d0) {
  return `<div class="p-sky up" ${D(d0)}>
<svg class="p-svg" viewBox="0 0 1660 330" aria-hidden="true"><defs>
<radialGradient id="gE" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="#8ff0e6"/><stop offset=".5" stop-color="#1b6f9a"/><stop offset="1" stop-color="#0b2a4a"/></radialGradient>
<radialGradient id="gM" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="#f6a676"/><stop offset=".55" stop-color="#d6683a"/><stop offset="1" stop-color="#6e2a12"/></radialGradient>
<linearGradient id="gS" x1="0" x2="1"><stop offset="0" stop-color="#5fd1c9"/><stop offset="1" stop-color="#d6683a"/></linearGradient></defs>
<path class="p-route" d="M250 190Q830 10 1430 190"/>
<path class="p-trail" pathLength="1" d="M250 190Q830 10 1430 190"/>
<circle class="p-glow e" cx="150" cy="200" r="110"/><circle cx="150" cy="200" r="78" fill="url(#gE)"/>
<circle class="p-glow m" cx="1510" cy="200" r="88"/><circle cx="1510" cy="200" r="58" fill="url(#gM)"/>
<g class="p-dot" transform="translate(250 190)"><circle class="halo" r="26"/><circle r="9" fill="#fff"/></g>
<text class="p-lbl" x="150" y="322">${esc(t.e)}</text><text class="p-lbl" x="1510" y="322">${esc(t.m)}</text></svg>
<div class="p-count"><span class="x">${esc(t.x)}</span> <b class="p-n">22</b> <span class="x">${esc(t.u)}</span><small>${esc(t.sig)}</small></div></div>`;
}

/* Daily check-in: sleep, mood and blood sugar with 7-day trends, color coding and a daily reminder.
   m = [label, value, unit, last 7 days, status ok|caut, status text, scale]. The values follow the app's example data
   for the Pilot (Illia): sleep and mood slide over the last days; blood sugar in mg/dL, mood of 5, as in the app. */
/* each trend is drawn on a fixed scale [lo, hi] with a faint band for the usual range [from, to]
   (the app's caution limits: sleep under 6 h, mood 2 or lower, blood sugar outside 70–180 mg/dL) */
const CI_SCALE = { sleep: [4, 8.5, 6, 8.5], mood: [1, 5, 3, 5], sugar: [40, 220, 70, 180] };
const CHECKIN = {
  uk: { t: 'Щоденна перевірка', who: 'Пілот · тренд за 7 днів', rem: 'Нагадування щодня',
    m: [['Сон', '5', 'год', [7, 7, 6.5, 6, 5.5, 5, 5], 'caut', 'мало сну', CI_SCALE.sleep],
      ['Настрій', '2', 'з 5', [4, 4, 3, 3, 2, 2, 2], 'caut', 'низький настрій', CI_SCALE.mood],
      ['Цукор крові', '98', 'мг/дл', [96, 99, 94, 102, 97, 100, 98], 'ok', 'у нормі', CI_SCALE.sugar]] },
  en: { t: 'Daily check-in', who: 'Pilot · 7-day trend', rem: 'Daily reminder',
    m: [['Sleep', '5', 'h', [7, 7, 6.5, 6, 5.5, 5, 5], 'caut', 'short sleep', CI_SCALE.sleep],
      ['Mood', '2', 'of 5', [4, 4, 3, 3, 2, 2, 2], 'caut', 'low mood', CI_SCALE.mood],
      ['Blood sugar', '98', 'mg/dL', [96, 99, 94, 102, 97, 100, 98], 'ok', 'normal', CI_SCALE.sugar]] }
};
/* a 7-point sparkline that draws itself over its usual-range band; the last point is a dot in the status color */
function ciSpark(vals, st, d0, sc) {
  const w = 240, h = 64, px = 10, py = 8, s = sc || [Math.min(...vals), Math.max(...vals)], span = (s[1] - s[0]) || 1;
  const Y = v => h - py - (Math.min(s[1], Math.max(s[0], v)) - s[0]) / span * (h - 2 * py);
  const pts = vals.map((v, k) => [px + k * (w - 2 * px) / (vals.length - 1), Y(v)]);
  const d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L');
  const last = pts[pts.length - 1];
  const band = s.length > 2 ? `<rect class="ci-band" x="0" y="${Y(s[3]).toFixed(1)}" width="${w}" height="${(Y(s[2]) - Y(s[3])).toFixed(1)}" rx="6"/>` : '';
  return `<svg class="ci-sp ${st}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${band}<path class="ci-ln draw" pathLength="1" ${D(d0)} d="${d}"/>` +
    pts.slice(0, -1).map((p, k) => `<circle class="ci-pt pop" ${D(d0 + 120 + k * 90)} cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4"/>`).join('') +
    `<circle class="ci-dot ${st} pop" ${D(d0 + 800)} cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="8"/></svg>`;
}
/* the check-in card: v = 'row' (full-width strip) or 'stack' (narrow column, metrics as rows) */
function checkin(c, d0, v) {
  return `<div class="card ci ci-${v} up" ${D(d0)}><div class="ci-h"><div class="ico">${ico('cal')}</div><div class="ci-ht"><b>${esc(c.t)}</b><small>${esc(c.who)}</small></div>` +
    `<span class="ci-rem">${ico('bell', 'sm')}<span>${esc(c.rem)}</span></span></div>` +
    `<div class="ci-ms">${c.m.map((m, k) => `<div class="ci-m ${m[4]}"><div class="ci-top"><span class="ci-l">${esc(m[0])}</span><span class="ci-st"><i></i>${esc(m[5])}</span></div>` +
      `<div class="ci-v"><b>${esc(m[1])}</b><small>${esc(m[2])}</small></div>${ciSpark(m[3], m[4], d0 + 350 + k * 160, m[6])}</div>`).join('')}</div></div>`;
}

/* the three badges of the solution slide: offline, one file, two languages */
function badges(t, cls) { return `<div class="f-side${cls ? ' ' + cls : ''}">${t.b.map((b, k) => `<div class="f-b up" ${D(1350 + k * 130)}>${ico(['sigoff', 'file', 'globe'][k], 'sm')}<span>${esc(b)}</span></div>`).join('')}</div>`; }
/* the solution slide body; side = the right-hand column next to the complaint box, under = more under the complaint box */
function solHtml(t, i, side, wide, under) {
  return `${hd(t, i)}
<div class="f-row"><svg class="f-line" viewBox="0 0 1660 20" preserveAspectRatio="none" aria-hidden="true"><path class="draw" pathLength="1" ${D(700)} d="M207 10H1452"/></svg><i class="f-run"></i>
${t.s.map((s, k) => `<div class="f-step pop" ${D(450 + k * 180)}><div class="f-n">${ico(['user', 'chat', 'quest', 'check'][k])}<span>${k + 1}</span></div><b>${esc(s[0])}</b><small>${esc(s[1])}</small></div>`).join('')}</div>
<div class="f-bottom${wide ? ' f-wide' : ''}">${under ? '<div class="f-left">' : ''}<div class="card f-type up" ${D(1150)}><div class="f-in">${ico('chat', 'sm')}<span class="f-txt"></span><i class="caret"></i></div>
<div class="f-tags">${t.tags.map((g, k) => `<span class="tg ${g[1]}" style="--k:${k}">${esc(g[0])}</span>`).join('')}</div></div>
${under ? under + '</div>' : ''}${side}</div>`;
}

const SLIDES = [
{
  id: 'title', edge: true, mood: [1480, 920, 860, .32, 'm'],
  uk: { name: 'Асклепій', tag: 'Лікар, який *завжди на борту*', sub: 'Офлайн ШІ-медик для екіпажу, що летить на Марс', team: 'Команда:', mem: 'Учасники:',
    foot: 'NASA Space Apps Challenge 2026 · ПЗ для моніторингу здоров’я астронавтів у космічних місіях' },
  en: { name: 'Asklepios', tag: 'The doctor who is *always on board*', sub: 'An offline AI medic for a crew on its way to Mars', team: 'Team:', mem: 'Members:',
    foot: 'NASA Space Apps Challenge 2026 · Create Health Monitoring Software for Astronauts on Space Missions' },
  /* the team block is the thank-you slide's, so the deck opens and closes with the same names */
  html: (t, L) => `<div class="ctr t1">
<div class="orbit"><svg viewBox="0 0 1600 700" aria-hidden="true"><path class="draw" ${D(200)} pathLength="1" d="M100 350a700 250 0 1 0 1400 0a700 250 0 1 0 -1400 0"/></svg><i class="odot"></i></div>
<div class="lw pop" ${D(120)}><i class="ring"></i><i class="ring r2"></i><i class="logo big"></i></div>
<h1 class="h1" aria-label="${esc(t.name)}">${kc(t.name, 380, 55)}</h1>
<p class="t-tag">${kt(t.tag, 900, 70)}</p>
<p class="sub up" ${D(1350)}>${esc(t.sub)}</p>
<div class="team-box up" ${D(1500)}>${teamRow(t.team, TEAM_INFO.name)}${teamRow(t.mem, members(L), true)}</div>
<div class="foot up" ${D(1650)}>${esc(t.foot)}</div>
<div class="hint fade" ${D(2700)}>${hint()}</div></div>`
},
{
  id: 'problem', mood: [1640, 420, 640, .3, 'm'],
  uk: { k: 'Проблема', h: 'До Марса *далеко*.\nДопомога не прийде.', x: 'до', u: 'хв', sig: 'сигнал в один бік · 3–22 хв · NASA', e: 'Земля', m: 'Марс',
    f: [['~13 днів', 'без зв’язку, коли Сонце між Землею і Марсом', 'NASA'], ['Лікаря немає', 'на борту лише медофіцер екіпажу', ''], ['Евакуації немає', 'і аптечку не поповнити до кінця місії', '']] },
  en: { k: 'The problem', h: 'Mars is *far away*.\nHelp isn’t coming.', x: 'up to', u: 'min', sig: 'one-way signal · 3–22 min · NASA', e: 'Earth', m: 'Mars',
    f: [['~13 days', 'of blackout when the Sun is between Earth and Mars', 'NASA'], ['No doctor', 'on board — only a crew medical officer', ''], ['No evacuation', 'and no resupply until the mission ends', '']] },
  html: (t, L, i) => `${hd(t, i)}
${pSky(t, 250)}
<div class="p-facts">${t.f.map((f, k) => `<div class="card p-f up" ${D(800 + k * 150)}>${icb(['sigoff', 'nodoc', 'xcirc'][k])}<div><b>${esc(f[0])}</b><span>${esc(f[1])}</span>${f[2] ? `<em class="src">${esc(f[2])}</em>` : ''}</div></div>`).join('')}</div>`,
  play(el) {
    const dot = el.querySelector('.p-dot'), tr = el.querySelector('.p-trail'), n = el.querySelector('.p-n');
    const set = (p, a) => {
      const q = 1 - p, x = q * q * 250 + 2 * q * p * 830 + p * p * 1430, y = q * q * 190 + 2 * q * p * 10 + p * p * 190;
      dot.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
      tr.style.strokeDashoffset = (1 - p).toFixed(4);
      n.textContent = Math.round(p * 22);
      dot.style.opacity = tr.style.opacity = a;
    };
    if (RM) { set(1, 1); return; }

  const k = e.key;
  if ((k === ' ' || k === 'Enter') && e.target && e.target.closest && e.target.closest('button, a')) return;
  if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || (k === ' ' && !e.shiftKey) || k === 'Enter') { e.preventDefault(); go(cur + 1); }
  else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || (k === ' ' && e.shiftKey) || k === 'Backspace') { e.preventDefault(); go(cur - 1); }
  else if (k === 'Home') { e.preventDefault(); go(0); }
  else if (k === 'End') { e.preventDefault(); go(N - 1); }
  else if (!ONE_LANG && !e.repeat && (e.code === 'KeyL' || k === 'l' || k === 'L' || k === 'д' || k === 'Д')) setLang(L === 'uk' ? 'en' : 'uk');
  else if (!e.repeat && e.code === 'KeyF') toggleFS();
});
let lastSwipe = 0, tx0 = null, ty0 = 0, hideT = 0;
/* click: a narrow strip on the left goes back, anywhere else goes forward ("click — next") */
addEventListener('click', e => {
  if (e.button !== 0 || Date.now() - lastSwipe < 600) return;
  const t = e.target && e.target.closest ? e.target : null;
  if (t && t.closest('#lang, a, button')) return;
  if (e.clientX < innerWidth * 0.2) go(cur - 1); else go(cur + 1);
});
addEventListener('touchstart', e => {
  if (e.touches.length === 1) { tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY; } else tx0 = null;
}, { passive: true });
addEventListener('touchend', e => {
  if (tx0 === null) return;
  const t = e.changedTouches[0], dx = t.clientX - tx0, dy = t.clientY - ty0;
  tx0 = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) { lastSwipe = Date.now(); go(cur + (dx < 0 ? 1 : -1)); }
}, { passive: true });
addEventListener('mousemove', e => {
  mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5;
  document.body.classList.remove('nocur');
  clearTimeout(hideT);
  hideT = setTimeout(() => document.body.classList.add('nocur'), 2500);
});
addEventListener('hashchange', () => { const i = readHash(); if (i !== cur) go(i); });
addEventListener('resize', fit);
if (RMQ) {
  const onRM = e => { setRM(e.matches); go(cur, { force: true, instant: true }); };
  if (RMQ.addEventListener) RMQ.addEventListener('change', onRM); else if (RMQ.addListener) RMQ.addListener(onRM);
}

/* ---------- start ---------- */
document.documentElement.classList.toggle('rm', RM);
applyLang();
fit();
go(readHash(), { instant: true });
startLoop();

</script>
